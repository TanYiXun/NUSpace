sources:
  - id: openfreemap
    name: OpenFreeMap public MapLibre style
    source_owner: OpenFreeMap contributors
    source_url: https://tiles.openfreemap.org/styles/liberty
    documentation_url: https://openfreemap.org/quick_start/
    terms_or_license_url: https://openfreemap.org/
    license: MIT for OpenFreeMap project; map data from OpenStreetMap; included projects have their own listed licenses
    allowed_use: Prototype basemap rendering with MapLibre GL JS; public instance currently requires no API key
    disallowed_use: Do not remove attribution; do not treat public-hosted tiles as an SLA-backed production dependency without an ADR
    attribution_text: OpenFreeMap © OpenMapTiles Data from OpenStreetMap
    attribution_required: true
    commercial_use_allowed: true
    redistribution_allowed: unknown
    derived_data_rules: Do not derive NUS building, route, room, or indoor data from this basemap without separate provenance review
    date_checked: 2026-09-17
    next_review_date: 2026-10-17
    source_status: verified
    used_for:
      - Phase 0 Prototype A base map rendering
    limitations:
      - Public instance does not provide a project-specific SLA
      - Basemap labels and geometry are not authoritative NUS campus data
      - Production use should be reviewed against self-hosting or a contracted tile provider
  - id: osm-overpass-com3
    name: OpenStreetMap COM3 building footprint
    source_owner: OpenStreetMap contributors
    source_url: https://www.openstreetmap.org/relation/15780831
    documentation_url: https://wiki.openstreetmap.org/wiki/Overpass_API
    terms_or_license_url: https://www.openstreetmap.org/copyright
    license: Open Database License
    allowed_use: Prototype building footprint and building level metadata for Phase 0 Prototype B with attribution
    disallowed_use: Do not treat OSM geometry as official NUS floor plan, indoor layout, exact height, or accessibility data
    attribution_text: © OpenStreetMap contributors
    attribution_required: true
    commercial_use_allowed: true
    redistribution_allowed: true under ODbL requirements
    derived_data_rules: Derived geometry must preserve OSM attribution and note modifications or height estimates
    date_checked: 2026-09-17
    next_review_date: 2026-10-17
    source_status: verified
    used_for:
      - Phase 0 Prototype B COM3 footprint
      - Phase 0 Prototype B COM3 building level count
      - Phase 0 Prototype E generated campus building pipeline input
    limitations:
      - Footprint is community-maintained, not official NUS data
      - OSM supplies building:levels=6 but not exact building height
      - Extrusion height is a prototype placeholder estimate
  - id: manual-osm-d1-prototype-route
    name: Manually curated D1 prototype route
    source_owner: NUS route naming from public references; geometry manually curated against OpenStreetMap road context
    source_url: https://landtransportguru.net/nus-isb-d1/
    documentation_url: https://www.openstreetmap.org/copyright
    terms_or_license_url: https://www.openstreetmap.org/copyright
    license: Prototype manual curation with OpenStreetMap context; not official NUS shuttle data
    allowed_use: Phase 0 Prototype C corridor rendering and simulated vehicle animation only
    disallowed_use: Do not present as official NUS route geometry, live vehicle data, real-time ETA data, accessibility routing, or production shuttle data
    attribution_text: Prototype route manually curated with OpenStreetMap context; not official NUS shuttle data
    attribution_required: true
    commercial_use_allowed: unknown
    redistribution_allowed: unknown
    derived_data_rules: Keep derived route and stop coordinates labelled as prototype-placeholder until official NUS route geometry or approved data is available
    date_checked: 2026-09-17
    next_review_date: 2026-10-17
    source_status: prototype-placeholder
    used_for:
      - Phase 0 Prototype C simulated D1 route corridor
      - Phase 0 Prototype C simulated D1 stop markers
      - Phase 0 Prototype C fake vehicle animation path
    limitations:
      - Stop sequence reference is public but not treated as an official data license
      - Coordinates are manually curated for visual and animation testing and are not a complete official D1 loop
      - No real-time arrivals or live vehicle positions are included
  - id: nus-uci-internal-shuttle-bus
    name: NUS UCI Internal Shuttle Bus pages
    source_owner: National University of Singapore University Campus Infrastructure
    source_url: https://uci.nus.edu.sg/campus-life/campus-services/transportation/internal-shuttle-bus/
    documentation_url: https://uci.nus.edu.sg/resources/faqs/campus-services-transport/
    terms_or_license_url: https://nus.edu.sg/legal-information-notices
    license: Public website reference; rights remain with NUS
    allowed_use: Manual reference for NUS ISB route names, route availability notes, and static-route source-disclosure copy
    disallowed_use: Do not treat page images as machine-readable route geometry, live arrival data, live vehicle data, crowd level data, or production-ready stop coordinates
    attribution_text: NUS Internal Shuttle Bus information from NUS University Campus Infrastructure
    attribution_required: true
    commercial_use_allowed: unknown
    redistribution_allowed: unknown
    derived_data_rules: Keep manually curated route displays labelled prototype, source-pending, or prototype-placeholder until official route geometry, verified stop positions, or a permitted feed is documented
    date_checked: 2026-10-01
    next_review_date: 2026-11-01
    source_status: manual-reference
    used_for:
      - Phase 2 NUS ISB route-list reference
      - Phase 2 prototype route disclosure copy
    limitations:
      - Public page confirms route families and points users to uNivUS for up-to-the-minute schedules and live locations
      - Route maps are image-based and are not ingested as production geometry
      - No public API access, machine-readable stop sequence, or live shuttle feed is granted by this source
  - id: nus-campus-map-shuttle-routes
    name: NUS Campus Map shuttle routes page
    source_owner: National University of Singapore
    source_url: https://map.nus.edu.sg/index.php/main/mobile/shuttle_routes
    documentation_url: https://map.nus.edu.sg/index.php/main/mobile/shuttle_routes
    terms_or_license_url: https://nus.edu.sg/legal-information-notices
    license: Public website reference; rights remain with NUS
    allowed_use: Manual reference for the existence of listed NUS shuttle route controls in prototype route UI
    disallowed_use: Do not scrape or infer route geometry, live arrivals, live vehicle positions, or stop coordinates from the page without permission
    attribution_text: Shuttle route list from NUS Campus Map
    attribution_required: true
    commercial_use_allowed: unknown
    redistribution_allowed: unknown
    derived_data_rules: Use only for source-labelled prototype route UI until official route data and verified stop positions are available
    date_checked: 2026-10-01
    next_review_date: 2026-11-01
    source_status: manual-reference
    used_for:
      - Phase 2 NUS ISB prototype route source boundary
      - Phase 2 D1 prototype route control label
    limitations:
      - Page lists route controls but does not expose a documented public route geometry API
      - Does not provide live NUS ISB arrivals, crowd level, or live vehicle positions
  - id: nusmods-public-api
    name: NUSMods public API
    source_owner: NUSMods
    source_url: https://api.nusmods.com/v2/
    documentation_url: https://github.com/nusmodifications/nusmods
    terms_or_license_url: https://github.com/nusmodifications/nusmods/blob/master/LICENSE
    license: MIT for NUSMods project; module data availability is provided through the public API
    allowed_use: Phase 3 module lookup, lesson venue display, and venue-code mapping with confidence metadata
    disallowed_use: Do not infer room-level geometry, indoor routes, current occupancy, or official venue coordinates from module venue codes alone
    attribution_text: Module and timetable data from NUSMods public API
    attribution_required: true
    commercial_use_allowed: true
    redistribution_allowed: true
    derived_data_rules: Preserve academic year, module code, venue code, and mapping confidence; unknown venues must remain unmapped
    date_checked: 2026-10-01
    next_review_date: 2026-11-01
    source_status: verified
    used_for:
      - Phase 3 NUSMods module lookup
      - Phase 3 lesson venue summaries
      - Phase 3 venue-code to campus-place mapping
    limitations:
      - Venue codes identify lesson locations but do not prove room geometry or indoor navigability
      - Module data changes by academic year and semester
      - Public API should be used responsibly and cached later if traffic grows
  - id: osm-api-nus-kent-ridge-map
    name: OpenStreetMap bounded NUS Kent Ridge extract
    source_owner: OpenStreetMap contributors
    source_url: https://api.openstreetmap.org/api/0.6/map?bbox=103.770,1.290,103.785,1.306
    documentation_url: https://wiki.openstreetmap.org/wiki/API_v0.6
    terms_or_license_url: https://www.openstreetmap.org/copyright
    license: Open Database License
    allowed_use: MVP 1 seed dataset for searchable NUS-area buildings, bus stops, building footprints, and places with OpenStreetMap attribution
    disallowed_use: Do not treat as official NUS building inventory, official NUS shuttle stop list, live shuttle data, indoor map data, accessibility routing data, or exact campus operations data
    attribution_text: © OpenStreetMap contributors
    attribution_required: true
    commercial_use_allowed: true
    redistribution_allowed: true under ODbL requirements
    derived_data_rules: Derived place and footprint data must preserve OSM object type, OSM id, attribution, date checked, and any limitation notes
    date_checked: 2026-09-18
    next_review_date: 2026-10-18
    source_status: verified
    used_for:
      - MVP 1 searchable campus place seed
      - MVP 1 OSM-sourced bus stop marker seed
      - MVP 1 OSM-sourced building search seed
      - MVP 1 OSM-sourced visible building footprint seed
    limitations:
      - Community-maintained OSM data is not official NUS data
      - OSM bus stop coordinates are seed markers only and may be offset from actual boarding points
      - OSM bus stop coordinates do not provide live NUS ISB arrivals, crowd levels, official shuttle route membership, or official stop locations
      - Bounded extract was curated into `data/curated/mvp1-campus-places.json`; selected OSM way/full responses were curated into `data/curated/mvp1-building-footprints.geojson`; the full raw OSM XML dumps are not committed
      - Some OSM objects inside the query bounds may be outside NUS-controlled campus areas and must be curated before display
  - id: lta-datamall-dynamic-apis
    name: LTA DataMall Dynamic APIs
    source_owner: Land Transport Authority Singapore
    source_url: https://datamall.lta.gov.sg/
    documentation_url: https://datamall.lta.gov.sg/content/datamall/en/dynamic-data.html
    terms_or_license_url: https://datamall.lta.gov.sg/
    license: LTA DataMall terms apply; AccountKey required for Dynamic APIs
    allowed_use: Phase 2 planning for public Singapore bus arrivals and public transport context near NUS, subject to AccountKey access and server-side key handling
    disallowed_use: Do not expose AccountKey in frontend code; do not assume NUS ISB routes are present; do not use deprecated Bus Arrival v2; do not present LTA public bus data as NUS internal shuttle data
    attribution_text: Public bus arrival data from LTA DataMall
    attribution_required: true
    commercial_use_allowed: unknown
    redistribution_allowed: unknown
    derived_data_rules: Cache and normalize public bus responses server-side only; preserve timestamps and distinguish public bus data from NUS shuttle data
    date_checked: 2026-09-18
    next_review_date: 2026-10-18
    source_status: requires-permission
    used_for:
      - Phase 2 public bus adapter planning
      - Phase 2 public bus arrival server adapter
    limitations:
      - Dynamic APIs require an AccountKey issued to registered DataMall subscribers
      - Bus Arrival v2 is decommissioned; future implementation must use the current documented Bus Arrival API version
      - LTA public bus services are not NUS internal shuttle services
      - This repository does not include an AccountKey; live public bus arrivals appear only when a server-side key is configured outside git
  - id: nus-public-bus-access-pages
    name: NUS public transport access pages
    source_owner: National University of Singapore
    source_url: https://theridge.nus.edu.sg/getting-here/
    documentation_url: https://enterprise.nus.edu.sg/contact-us/
    terms_or_license_url: https://nus.edu.sg/legal-information-notices
    license: Public website reference; rights remain with NUS
    allowed_use: Manual reference for public bus stop names, public bus stop codes, and public bus access notes near NUS
    disallowed_use: Do not treat as a machine-readable feed, live arrival source, NUS ISB API, official route geometry, or indoor navigation source
    attribution_text: Public transport access notes from NUS public web pages
    attribution_required: true
    commercial_use_allowed: unknown
    redistribution_allowed: unknown
    derived_data_rules: Keep manually extracted public bus stop metadata labelled as manual-reference and recheck before production use
    date_checked: 2026-09-18
    next_review_date: 2026-10-18
    source_status: manual-reference
    used_for:
      - Phase 2 public bus stop code reference for Heng Mui Keng Terrace
    limitations:
      - Human-readable public access pages, not an API
      - Does not provide real-time arrivals, route geometry, coordinates, or NUS ISB data
      - Stop code must still be queried through a permitted LTA DataMall server-side adapter
